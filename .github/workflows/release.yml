name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          LDFLAGS="-s -w -X main.Version=${VERSION}"

          if [ "${{ matrix.goos }}" = "windows" ]; then
            OUTPUT="42-cli-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}.exe"
          else
            OUTPUT="42-cli-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}"
          fi

          go build -ldflags "${LDFLAGS}" -o "${OUTPUT}"

          sha256sum "${OUTPUT}" > "${OUTPUT}.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: 42-cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            42-cli-*
            !42-cli-*.sha256
          retention-days: 1

      - name: Upload checksums
        uses: actions/upload-artifact@v7
        with:
          name: checksums-${{ matrix.goos }}-${{ matrix.goarch }}
          path: 42-cli-*.sha256
          retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts

      - name: Prepare release files
        run: |
          mkdir -p release-files
          find ./artifacts -name '42-cli-*' -type f -exec cp {} release-files/ \;

          cat release-files/*.sha256 > release-files/SHA256SUMS 2>/dev/null || true
          rm -f release-files/*.sha256

          ls -la release-files/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ## Installation

            ### Linux / macOS
            ```bash
            # Download binary for your platform
            wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/42-cli-${{ github.ref_name }}-linux-amd64
            # or
            wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/42-cli-${{ github.ref_name }}-darwin-amd64

            # Verify checksum (optional)
            wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/SHA256SUMS
            sha256sum -c SHA256SUMS --ignore-missing

            # Make executable and install
            chmod +x 42-cli-*
            sudo mv 42-cli-* /usr/local/bin/42-cli
            ```

            ### Windows
            Download the `.exe` file for your architecture (amd64 or arm64) and add it to your PATH.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
